name: 에이블리 주문 자동발송

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: ably-auto-send
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 크로미움 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1

      - name: 준비물 설치
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 새 주문 → 준비중 처리 → 메일 → 발송 처리
        env:
          SETTINGS_JSON: ${{ secrets.SETTINGS_JSON }}
          THEME_LINKS_JSON: ${{ secrets.THEME_LINKS_JSON }}
        run: python 에이블리_전자동.py --진짜

      - name: 실패했을 때 화면 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 실패화면
          path: |
            실패화면.png
            실패화면.html
            보류_수동처리.csv
            과정기록/
          retention-days: 3
          if-no-files-found: ignore
